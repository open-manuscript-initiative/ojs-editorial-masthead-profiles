name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave blank to use version.xml)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          XML_VERSION="$(php -r '$xml=simplexml_load_file("version.xml"); echo trim((string)$xml->release);')"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$XML_VERSION"
            fi
          fi

          VERSION="${VERSION#v}"
          if [ "$VERSION" != "$XML_VERSION" ]; then
            echo "Requested version $VERSION does not match version.xml release $XML_VERSION" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create release tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Tag $TAG already exists at $TAG_SHA, not current HEAD $HEAD_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points at this commit; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Editorial Masthead Profiles ${VERSION}"
            git push origin "$TAG"
          fi

      - name: Build PKP installable archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="editorialMastheadProfiles"
          ARCHIVE="${ROOT}-${VERSION}.tar.gz"

          mkdir -p "dist/${ROOT}"
          rsync -a ./ "dist/${ROOT}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/'

          tar -C dist -czf "${ARCHIVE}" "${ROOT}"
          md5sum "${ARCHIVE}" > "${ARCHIVE}.md5"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Editorial Masthead Profiles ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.md5
