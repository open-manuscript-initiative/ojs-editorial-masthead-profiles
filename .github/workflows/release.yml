name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag against version.xml
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          XML_VERSION="$(php -r '$xml=simplexml_load_file("version.xml"); echo trim((string)$xml->release);')"
          if [ "$TAG_VERSION" != "$XML_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match version.xml release $XML_VERSION" >&2
            exit 1
          fi

      - name: Build PKP installable archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="editorialMastheadProfiles"
          ARCHIVE="${ROOT}-${VERSION}.tar.gz"

          mkdir -p "dist/${ROOT}"
          rsync -a ./ "dist/${ROOT}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/'

          tar -C dist -czf "${ARCHIVE}" "${ROOT}"
          md5sum "${ARCHIVE}" > "${ARCHIVE}.md5"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.md5
