name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate version.xml
        run: |
          php -r '$xml = simplexml_load_file("version.xml"); if (!$xml) { exit(1); } foreach (["application", "type", "release", "date", "class"] as $field) { if (trim((string) $xml->{$field}) === "") { fwrite(STDERR, "Missing version.xml field: {$field}\n"); exit(1); } } if ((string) $xml->type !== "plugins.generic") { fwrite(STDERR, "Unexpected plugin type\n"); exit(1); }'

      - name: Check required release files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f version.xml
          test -f index.php
          test -f EditorialMastheadProfilesPlugin.php
