name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate version.xml
        run: |
          php -r '$xml = simplexml_load_file("version.xml"); if (!$xml) { exit(1); } foreach (["application", "type", "release", "date", "class"] as $field) { if (trim((string) $xml->{$field}) === "") { fwrite(STDERR, "Missing version.xml field: {$field}\n"); exit(1); } } if ((string) $xml->type !== "plugins.generic") { fwrite(STDERR, "Unexpected plugin type\n"); exit(1); }'

      - name: Check required release files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f AI_DISCLOSURE.md
          test -f version.xml
          test -f index.php
          test -f EditorialMastheadProfilesPlugin.php
          test -f templates/editorialMasthead.tpl
          test -f templates/editorProfile.tpl
          test -f styles/editorialMastheadCards.css
          test -f styles/editorProfile.css

      - name: Verify self-contained masthead cards
        run: |
          grep -Fq "getTemplateResource('editorialMasthead.tpl')" EditorialMastheadProfilesPlugin.php
          grep -Fq "page_editorial_masthead_cards" templates/editorialMasthead.tpl
          grep -Fq ".page_editorial_masthead_cards" styles/editorialMastheadCards.css
          grep -Fq "editorialMastheadProfileImageUrls" templates/editorialMasthead.tpl
          grep -Fq "profileBiography|strip_unsafe_html" templates/editorProfile.tpl
          grep -Fq "hasVerifiedOrcid" pages/EditorProfileHandler.php
          grep -Fq "styles/editorProfile.css" pages/EditorProfileHandler.php
          grep -Fq '$handler =& $args[3]' EditorialMastheadProfilesPlugin.php
          grep -Fq "getTemplateResource('editorProfile.tpl')" EditorialMastheadProfilesPlugin.php
          grep -Fq 'display($this->profileTemplateResource)' pages/EditorProfileHandler.php
          if grep -Fq "getLocalizedData('biography')" templates/editorialMasthead.tpl; then
            echo 'The full masthead must not display individual biographies.' >&2
            exit 1
          fi
          if grep -Fq "define('HANDLER_CLASS'" EditorialMastheadProfilesPlugin.php; then
            echo 'OJS 3.5 rejects HANDLER_CLASS route injection.' >&2
            exit 1
          fi
          if grep -Fq 'getDispatcher()->handle404' pages/EditorProfileHandler.php; then
            echo 'OJS 3.5 Dispatcher does not expose handle404().' >&2
            exit 1
          fi
          php tests/selfContainedMastheadTest.php
          php tests/editorProfileDataTest.php

      - name: Guard public profile data boundary
        run: |
          if grep -RInE "profileUser|getData\('(email|phone|mailingAddress|billingAddress|country|apiKey)'\)" \
              pages templates; then
            echo 'A private account field or the complete user object was exposed to the public profile template.' >&2
            exit 1
          fi

      - name: Reject installation-specific identifiers
        run: |
          if grep -RInE 'egyhaztortenetiszemle|openmanuscript\.org|journal[_ -]?id[^0-9]*=[^0-9]*[0-9]+' \
              --include='*.php' --include='*.tpl' --include='*.js' --include='*.css' .; then
            echo 'Installation-specific identifier found in distributable code.' >&2
            exit 1
          fi

      - name: Reject hard-coded Hungarian UI text in templates
        run: |
          if grep -RInE 'Szerkesztői gárda|Weboldal|Bemutatkozás' --include='*.tpl' templates; then
            echo 'User-facing template text must use locale keys.' >&2
            exit 1
          fi
